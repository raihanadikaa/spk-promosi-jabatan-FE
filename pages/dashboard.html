<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ESPEOKA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="app">
        <aside class="sidebar">
            <div class="brand">ESPEOKA</div>
            <nav>
                <a class="active" href="dashboard.html">Dashboard</a>
                <a href="assessment.html">Penilaian</a>
                <a href="ranking.html">Ranking</a>
                <a href="approval.html">Approval</a>
            </nav>
        </aside>

        <main class="content">
            <header>
                <p class="eyebrow">HRD Dashboard</p>
                <h1>Selamat datang.</h1>
                <p>Ringkasan proses promosi jabatan.</p>
            </header>

            <section class="stats">
                <div class="card">
                    <span>Total Karyawan</span>
                    <strong>120</strong>
                </div>

                <div class="card">
                    <span>Kandidat Promosi</span>
                    <strong>15</strong>
                </div>

                <div class="card">
                    <span>Menunggu Approval</span>
                    <strong>5</strong>
                </div>
            </section>

            <section class="card ranking-preview">
                <div class="section-heading">
                    <div>
                        <span class="eyebrow">SAW</span>
                        <h2>Ranking Teratas</h2>
                    </div>
                    <a href="ranking.html">Lihat semua →</a>
                </div>

                <div class="ranking-row">
                    <span>#1</span>
                    <strong>Ahmad</strong>
                    <span class="score">0.92</span>
                </div>

                <div class="ranking-row">
                    <span>#2</span>
                    <strong>Budi</strong>
                    <span class="score">0.87</span>
                </div>

                <div class="ranking-row">
                    <span>#3</span>
                    <strong>Citra</strong>
                    <span class="score">0.81</span>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
