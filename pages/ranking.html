<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - ESPEOKA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="app">
        <aside class="sidebar">
            <div class="brand">ESPEOKA</div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="assessment.html">Penilaian</a>
                <a class="active" href="ranking.html">Ranking</a>
                <a href="approval.html">Approval</a>
            </nav>
        </aside>

        <main class="content">
            <header>
                <p class="eyebrow">Simple Additive Weighting</p>
                <h1>Hasil Ranking</h1>
                <p>Daftar kandidat berdasarkan hasil perhitungan SAW.</p>
            </header>

            <section class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Kandidat</th>
                            <th>Nilai SAW</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#1</td>
                            <td><strong>Ahmad</strong></td>
                            <td>0.92</td>
                            <td><span class="badge success">Recommended</span></td>
                        </tr>
                        <tr>
                            <td>#2</td>
                            <td><strong>Budi</strong></td>
                            <td>0.87</td>
                            <td><span class="badge">Review</span></td>
                        </tr>
                        <tr>
                            <td>#3</td>
                            <td><strong>Citra</strong></td>
                            <td>0.81</td>
                            <td><span class="badge">Review</span></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

</body>
</html>
