<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian - ESPEOKA</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="app">
        <aside class="sidebar">
            <div class="brand">ESPEOKA</div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a class="active" href="assessment.html">Penilaian</a>
                <a href="ranking.html">Ranking</a>
                <a href="approval.html">Approval</a>
            </nav>
        </aside>

        <main class="content">
            <header>
                <p class="eyebrow">Assessment</p>
                <h1>Penilaian Kandidat</h1>
                <p>Masukkan nilai kandidat berdasarkan kriteria yang telah ditentukan.</p>
            </header>

            <section class="card">
                <label>Kandidat</label>
                <select>
                    <option>Ahmad</option>
                    <option>Budi</option>
                    <option>Citra</option>
                </select>

                <div class="criteria-grid">
                    <div>
                        <label>Lama Kerja</label>
                        <input type="number" placeholder="Nilai">
                    </div>

                    <div>
                        <label>Hasil Kinerja</label>
                        <input type="number" placeholder="Nilai">
                    </div>

                    <div>
                        <label>Pengalaman</label>
                        <input type="number" placeholder="Nilai">
                    </div>

                    <div>
                        <label>Kedisiplinan</label>
                        <input type="number" placeholder="Nilai">
                    </div>

                    <div>
                        <label>Sertifikasi</label>
                        <input type="number" placeholder="Nilai">
                    </div>
                </div>

                <button>Simpan Penilaian</button>
            </section>
        </main>
    </div>

</body>
</html>
